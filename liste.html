<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opskrifter</title>

    <link rel="stylesheet" href="liste.css" />
    <script src="liste.js" defer></script>

</head>

<body>
    <main class="page">
        <header class="site-header">
            <h1 class="logo">Opskrifter</h1>
        </header>

        <button id="filterMenuBtn" class="filter-menu-btn" type="button">
            ☰ Filtre
        </button>

        <section id="filterSection" class="filter-section">
            <div class="filter-row top-row">
                <input type="text" id="searchInput" class="filter-field wide-field" placeholder="Søg på opskrift..."
                    autocomplete="off" />

                <input type="text" id="includeIngredientsInput" class="filter-field wide-field"
                    placeholder="Ingredienser du har..." autocomplete="off" />

                <input type="text" id="excludeIngredientsInput" class="filter-field wide-field"
                    placeholder="Ingredienser du vil undgå..." autocomplete="off" />
            </div>

            <div class="filter-row middle-row">
                <select id="timeFilter" class="filter-field small-field">
                    <option value="all">Tid: alle</option>
                    <option value="30">Under 30 min</option>
                    <option value="45">Under 45 min</option>
                    <option value="60">Under 60 min</option>
                    <option value="90">Under 90 min</option>
                </select>
            </div>

            <div class="filter-row bottom-row">
                <select id="sortFilter" class="filter-field sort-field">
                    <option value="default">Sortér...</option>
                    <option value="time-asc">Kortest tid først</option>
                    <option value="time-desc">Længst tid først</option>
                    <option value="name-asc">Navn A-Å</option>
                    <option value="name-desc">Navn Å-A</option>
                </select>

                <label class="favorite-toggle" for="favoritesOnly">
                    <input type="checkbox" id="favoritesOnly" />
                    <span>Kun favoritter</span>
                </label>

                <button id="resetFilters" class="reset-btn" type="button">
                    Nulstil filtre
                </button>
            </div>
        </section>

        <section class="status-section">
            <p id="recipeCount" class="recipe-count">
                Indlæser opskrifter...
            </p>

            <p id="filterInfo" class="filter-info"></p>
        </section>

        <section id="recipesContainer" class="recipes-grid"></section>
    </main>
</body>

</html>
