<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opskrifter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="generel.css" />
    <link rel="stylesheet" href="header+footer.css" />
    <link rel="stylesheet" href="liste.css" />
    <script src="liste.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo-link" aria-label="Gå til forsiden">
                <img src="img/logosort.webp" alt="Logo" class="logo">
            </a>

            <nav class="main-nav" aria-label="Hovednavigation">
                <a href="#" class="nav-link">Opskrifter</a>

                <a href="#" class="icon-link" aria-label="Favoritter">
                    <img src="img/hjerte.webp" alt="" class="nav-icon">
                </a>

                <a href="#" class="icon-link" aria-label="Søg">
                    <img src="img/søg.png" alt="" class="nav-icon">
                </a>

                <a href="#" class="icon-link" aria-label="Kurv">
                    <img src="img/kurv.png" alt="" class="nav-icon">
                </a>

                <a href="#" class="icon-link" aria-label="Login">
                    <img src="img/login.png" alt="" class="nav-icon">
                </a>
            </nav>

            <button class="burger-menu" type="button" aria-label="Åbn menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="page">
        <h1 class="h1_tekst_liste">Opskrifter</h1>



        <section id="filterSection" class="filter-section" aria-label="Filtrering af opskrifter">

            <button id="resetFilters" class="reset-btn" type="button">
                Nulstil filtre
            </button>

            <div class="filter-grid">

                <input type="text" id="searchInput" class="filter-field" placeholder="Søg på opskrifter"
                    autocomplete="off">

                <input type="text" id="includeIngredientsInput" class="filter-field" placeholder="Ingredienser du har"
                    autocomplete="off">

                <input type="text" id="excludeIngredientsInput" class="filter-field" placeholder="Undgå ingredienser"
                    autocomplete="off">

                <select id="timeFilter" class="filter-field">
                    <option value="all">Tid: Alle</option>
                    <option value="30">Under 30 min</option>
                    <option value="45">Under 45 min</option>
                    <option value="60">Under 60 min</option>
                    <option value="90">Under 90 min</option>
                </select>

                <select id="sortFilter" class="filter-field">
                    <option value="default">Sortér</option>
                    <option value="time-asc">Kortest tid først</option>
                    <option value="time-desc">Længst tid først</option>
                    <option value="name-asc">Navn A-Å</option>
                    <option value="name-desc">Navn Å-A</option>
                </select>

                <input type="checkbox" id="favoritesOnly" class="favorite-checkbox">

                <label class="favorite-toggle" for="favoritesOnly">
                    Favoritter
                </label>

            </div>

        </section>

        <section class="status-section">
            <p id="recipeCount" class="recipe-count">
                Indlæser opskrifter...
            </p>

            <p id="filterInfo" class="filter-info"></p>
        </section>

        <section id="recipesContainer" class="recipes-grid"></section>

    </main>


    <footer class="site-footer">
        <div class="footer-inner">

            <nav class="footer-nav" aria-label="Footer navigation">
                <a href="kontakt.html">Kontakt</a>
                <a href="omos.html">Om os</a>
            </nav>

            <div class="footer-socials" aria-label="Sociale medier">
                <a href="#" aria-label="Facebook">
                    <img src="img/facebook-removebg-preview.png" alt="">
                </a>

                <a href="#" aria-label="Instagram">
                    <img src="img/Insta-removebg-preview.png" alt="">
                </a>
            </div>

        </div>
    </footer>
</body>

</html>
